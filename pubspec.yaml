name: podcast_player
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Data Modeling
  freezed: ^3.0.6
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0

  # Local Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.5

  # Audio Playback
  just_audio: ^0.9.43
  just_audio_background: ^0.0.1-beta.14

  # Networking
  dio: ^5.8.0

  # RSS Parsing
  rss_dart: ^1.0.14

  # Image Caching
  cached_network_image: ^3.4.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
